<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-System Login | Tech Hub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='multi_login.css') }}">
</head>
<body>

<div class="login-wrapper">

  <!-- Left Branding Panel -->
  <div class="login-left">
    <h1>Cooplink</h1>
    <p>Manage your systems effortlessly</p>
    <div class="branding-icons">
      <!-- Optional small logos or patterns -->
    </div>
  </div>
  

  <!-- Right Login Panel -->
  <div class="login-right">
    <form action="{{ url_for('log_in') }}" method="POST" class="login-form">
      <h2>Sign In</h2>

      {% with message = get_flashed_messages() %}
      {% if message %}
      {% for msg in message %}
        <p class="message">{{ message }}</p>
      {% endfor %}
      {% endif %}
      {% endwith %}

      <!-- System Selector -->
      <label for="system">Select System</label>
      <select name="system" id="system" required>
        <option value="">-- Choose your system --</option>
        <option value="campus_suite">Campus Suite</option>
        <option value="cooplink">CoopLink</option>
        <option value="orphange_webapp">Orphange WebApp</option>
      </select>

      <!-- User Credentials -->
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>

      <div class="remember-me">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember">Remember Me</label>
      </div>

      <button type="submit" class="login-btn">Log In</button>

      <p class="signup-link">
        Don't have an account? <a href="{{ url_for('sign__up') }}">Sign Up</a>
      </p>
      <div class="signup-link"><a href="{{ url_for('home') }}">Home</a></div>
    </form>
    
  </div>

</div>

</body>
</html>
